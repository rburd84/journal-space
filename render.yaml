# Stillspace private beta — Render Hobby workspace.
# Provision only after explicit approval; disable Blueprint Auto Sync in Render.
services:
  - type: web
    name: stillspace-api
    runtime: python
    plan: 0.5c-512mb
    autoDeployTrigger: "off"
    buildCommand: pip install uv && uv sync --locked --no-dev
    preDeployCommand: uv run --no-sync alembic upgrade head
    startCommand: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: STILLSPACE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stillspace-db
          property: connectionString
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: stillspace-web
    runtime: static
    rootDir: frontend
    autoDeployTrigger: "off"
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_ORIGIN
        sync: false

databases:
  - name: stillspace-db
    plan: 0.1c-256mb
    postgresMajorVersion: "18"
    databaseName: stillspace
    user: stillspace_app
